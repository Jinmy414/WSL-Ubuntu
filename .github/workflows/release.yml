name: Windows Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Build the Windows archive
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $output = Join-Path $env:RUNNER_TEMP 'wsl-ubuntu-release'
          & .\setup\package-windows.ps1 -Version $version -OutputDirectory $output
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-release-assets
          path: ${{ runner.temp }}/wsl-ubuntu-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-release-assets
          path: release-assets
      - name: Verify the archive checksum
        working-directory: release-assets
        shell: bash
        run: |
          version=${GITHUB_REF_NAME#v}
          sha256sum --check --strict "WSL-Ubuntu-$version-windows.zip.sha256"
      - name: Publish the GitHub release
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          archive="WSL-Ubuntu-$version-windows.zip"
          release_flags=()
          if [[ $version == *-* ]]; then release_flags+=(--prerelease); fi

          if draft=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft'); then
            if [[ $draft == false ]]; then
              # Reruns leave published downloads intact and check their checksum.
              existing=$(mktemp -d)
              trap 'rm -f -- "$existing/$archive" "$existing/$archive.sha256"; rmdir -- "$existing"' EXIT
              gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
                --pattern "$archive" --pattern "$archive.sha256" --dir "$existing"
              (cd "$existing" && sha256sum --check --strict "$archive.sha256")
              exit 0
            fi
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
              --draft --verify-tag --generate-notes "${release_flags[@]}"
          fi

          gh release upload "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
