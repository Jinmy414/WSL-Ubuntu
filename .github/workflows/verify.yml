name: Verify

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Build Windows console
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Compile the WPF application
        shell: pwsh
        run: |
          $output = Join-Path $env:RUNNER_TEMP 'UbuntuDS-Console.exe'
          & .\setup\build-console.cmd $output
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $output -PathType Leaf)) {
            throw 'The Windows console build did not produce an executable.'
          }
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $scripts = Get-ChildItem -Path setup, bin, tests -Filter *.ps1 -File
          foreach ($script in $scripts) {
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $script.FullName, [ref]$null, [ref]$parseErrors)
            if ($parseErrors) {
              throw "$($script.Name): $($parseErrors.Message -join ', ')"
            }
          }
      - name: Exercise the RDP probe over loopback
        shell: pwsh
        run: ./tests/Test-RdpProbe.ps1

  linux:
    name: Check Linux scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Parse guest setup and service scripts
        shell: bash
        run: |
          for script in setup/*.sh setup/ds-headless-shell setup/ds-proxy-bash; do
            bash -n "$script"
          done
          python3 -m py_compile setup/ds-proxy-watch
      - name: Exercise proxy synchronization and command launching
        shell: bash
        run: python3 -m unittest discover -s tests -v
